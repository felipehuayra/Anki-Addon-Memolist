<div class="pc-question">{{Pergunta}}</div>

<div id="pc-source" style="display:none">{{Itens}}</div>
<ol id="pc-list"></ol>
<button id="pc-btn" type="button">Revelar próximo</button>

<script>
(function () {
  var src = document.getElementById("pc-source");
  var list = document.getElementById("pc-list");
  var btn = document.getElementById("pc-btn");

  // Cada quebra de linha do editor do Anki (<br>, <div>, <p>, <li>) separa um item.
  // O texto é extraído com DOMParser (nada é executado) e inserido com textContent.
  var parts = (src ? src.innerHTML : "").split(/<br\s*\/?>|<\/div>|<\/p>|<\/li>|\n/i);
  var items = [];
  for (var i = 0; i < parts.length; i++) {
    var t = new DOMParser().parseFromString(parts[i], "text/html").body.textContent.trim();
    if (t) items.push(t);
  }

  if (items.length === 0) {
    list.style.display = "none";
    btn.textContent = "(lista vazia)";
    btn.disabled = true;
    return;
  }

  var lis = [];
  for (var j = 0; j < items.length; j++) {
    var li = document.createElement("li");
    li.className = "pc-hidden";
    li.textContent = "{}";
    list.appendChild(li);
    lis.push(li);
  }

  var shown = 0;
  function update() {
    if (shown >= items.length) {
      btn.disabled = true;
      btn.textContent = "Tudo revelado: toque em Mostrar resposta";
    } else {
      btn.textContent = "Revelar próximo (" + shown + "/" + items.length + ")";
    }
  }

  btn.addEventListener("click", function () {
    if (shown >= items.length) return;
    lis[shown].className = "";
    lis[shown].textContent = items[shown];
    shown++;
    update();
  });

  update();
})();
</script>
